<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">MagicInterview real-time verification architecture</title>
  <desc id="desc">A controlled audio or text input flows through semantic turn routing, a bounded model provider layer, per-user state, and the live coach, with deterministic verification at each boundary.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#11233b"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#63e6be"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-opacity=".3"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="96" y="102" fill="#63e6be" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="4">TECHNICAL CASE STUDY</text>
  <text x="96" y="165" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="48" font-weight="760">Real-time AI that can prove what happened</text>
  <text x="96" y="210" fill="#9fb1c7" font-family="Inter,Arial,sans-serif" font-size="24">MagicInterview · controlled replay → causal trace → bounded verification</text>
  <g font-family="Inter,Arial,sans-serif" filter="url(#shadow)">
    <g transform="translate(96 310)"><rect width="245" height="150" rx="18" fill="#122b43" stroke="#2c526c"/><text x="28" y="48" fill="#63e6be" font-size="17" font-weight="700">01 · INPUT</text><text x="28" y="87" fill="#f8fafc" font-size="24" font-weight="700">Speech or text</text><text x="28" y="120" fill="#9fb1c7" font-size="17">final segments only</text></g>
    <g transform="translate(390 310)"><rect width="265" height="150" rx="18" fill="#122b43" stroke="#2c526c"/><text x="28" y="48" fill="#63e6be" font-size="17" font-weight="700">02 · ROUTE</text><text x="28" y="87" fill="#f8fafc" font-size="24" font-weight="700">Turn semantics</text><text x="28" y="120" fill="#9fb1c7" font-size="17">request, continuation, noise</text></g>
    <g transform="translate(704 310)"><rect width="265" height="150" rx="18" fill="#122b43" stroke="#2c526c"/><text x="28" y="48" fill="#63e6be" font-size="17" font-weight="700">03 · GENERATE</text><text x="28" y="87" fill="#f8fafc" font-size="24" font-weight="700">Bounded providers</text><text x="28" y="120" fill="#9fb1c7" font-size="17">schema + timeout + fallback</text></g>
    <g transform="translate(1018 310)"><rect width="245" height="150" rx="18" fill="#122b43" stroke="#2c526c"/><text x="28" y="48" fill="#63e6be" font-size="17" font-weight="700">04 · PERSIST</text><text x="28" y="87" fill="#f8fafc" font-size="24" font-weight="700">Account state</text><text x="28" y="120" fill="#9fb1c7" font-size="17">isolated transcript + answer</text></g>
    <g transform="translate(1312 310)"><rect width="192" height="150" rx="18" fill="#163c42" stroke="#63e6be"/><text x="24" y="48" fill="#63e6be" font-size="17" font-weight="700">05 · RENDER</text><text x="24" y="87" fill="#f8fafc" font-size="23" font-weight="700">Live coach</text><text x="24" y="120" fill="#b6f4e2" font-size="16">next useful words</text></g>
  </g>
  <g stroke="#63e6be" stroke-width="4" marker-end="url(#arrow)"><path d="M341 385h45"/><path d="M655 385h45"/><path d="M969 385h45"/><path d="M1263 385h45"/></g>
  <g font-family="Inter,Arial,sans-serif">
    <rect x="96" y="560" width="1408" height="224" rx="22" fill="#091827" stroke="#2c526c"/>
    <text x="132" y="616" fill="#63e6be" font-size="18" font-weight="700" letter-spacing="2">VERIFICATION PLANE</text>
    <g fill="#f8fafc" font-size="25" font-weight="700"><text x="132" y="674">14 / 14</text><text x="462" y="674">2 users</text><text x="772" y="674">4.8 MB MP3</text><text x="1110" y="674">6 viewports</text></g>
    <g fill="#9fb1c7" font-size="17"><text x="132" y="710">semantic routing fixtures</text><text x="462" y="710">persistence isolation</text><text x="772" y="710">40 ordered speaker turns</text><text x="1110" y="710">responsive + PWA checks</text></g>
    <path d="M132 742h1236" stroke="#27445a"/><text x="132" y="769" fill="#9fb1c7" font-size="16">Proof is attached to the same input, request, provider response, persisted state, and rendered result—not inferred from a green badge.</text>
  </g>
</svg>
