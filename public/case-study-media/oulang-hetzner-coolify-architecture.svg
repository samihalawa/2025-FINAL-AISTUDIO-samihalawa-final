<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">OULANG Hetzner and Coolify production architecture</title>
  <desc id="desc">Cloudflare fronts a GitHub-driven Coolify deployment on Hetzner. The application connects to MySQL and Hetzner object storage, while optional provider-specific AI calls remain explicit.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#091426"/><stop offset="1" stop-color="#17275b"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#7c9cff"/></marker><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-opacity=".28"/></filter></defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="96" y="102" fill="#9db0ff" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="4">PLATFORM MIGRATION</text>
  <text x="96" y="165" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="46" font-weight="760">Retiring Cloud Run without flattening the provider boundary</text>
  <text x="96" y="210" fill="#aab7d3" font-family="Inter,Arial,sans-serif" font-size="24">OULANG · main → Dockerfile → Coolify/Hetzner · Cloudflare at the edge</text>
  <g font-family="Inter,Arial,sans-serif" filter="url(#s)">
    <g transform="translate(96 332)"><rect width="250" height="160" rx="20" fill="#12264d" stroke="#405d9d"/><text x="30" y="48" fill="#9db0ff" font-size="17" font-weight="700">SOURCE</text><text x="30" y="90" fill="#fff" font-size="26" font-weight="700">GitHub main</text><text x="30" y="126" fill="#aab7d3" font-size="17">verified build + push event</text></g>
    <g transform="translate(415 332)"><rect width="300" height="160" rx="20" fill="#12264d" stroke="#405d9d"/><text x="30" y="48" fill="#9db0ff" font-size="17" font-weight="700">DEPLOYMENT</text><text x="30" y="90" fill="#fff" font-size="26" font-weight="700">Coolify on Hetzner</text><text x="30" y="126" fill="#aab7d3" font-size="17">pinned lockfile · Docker health</text></g>
    <g transform="translate(784 332)"><rect width="300" height="160" rx="20" fill="#12264d" stroke="#405d9d"/><text x="30" y="48" fill="#9db0ff" font-size="17" font-weight="700">APPLICATION</text><text x="30" y="90" fill="#fff" font-size="26" font-weight="700">React + Node/tRPC</text><text x="30" y="126" fill="#aab7d3" font-size="17">web, iOS and Android surface</text></g>
    <g transform="translate(1153 332)"><rect width="351" height="160" rx="20" fill="#18336b" stroke="#7c9cff"/><text x="30" y="48" fill="#9db0ff" font-size="17" font-weight="700">EDGE</text><text x="30" y="90" fill="#fff" font-size="26" font-weight="700">Cloudflare → oulang.ai</text><text x="30" y="126" fill="#cbd5ff" font-size="17">TLS, routing, static bridge</text></g>
  </g>
  <g stroke="#7c9cff" stroke-width="4" marker-end="url(#a)"><path d="M346 412h65"/><path d="M715 412h65"/><path d="M1084 412h65"/></g>
  <g font-family="Inter,Arial,sans-serif">
    <rect x="96" y="582" width="420" height="190" rx="18" fill="#0c1b36" stroke="#405d9d"/><text x="128" y="628" fill="#9db0ff" font-size="17" font-weight="700">STATE</text><text x="128" y="671" fill="#fff" font-size="25" font-weight="700">MySQL on Hetzner</text><text x="128" y="707" fill="#aab7d3" font-size="17">existing production database</text><text x="128" y="739" fill="#aab7d3" font-size="17">no duplicate datastore created</text>
    <rect x="590" y="582" width="420" height="190" rx="18" fill="#0c1b36" stroke="#405d9d"/><text x="622" y="628" fill="#9db0ff" font-size="17" font-weight="700">MEDIA</text><text x="622" y="671" fill="#fff" font-size="25" font-weight="700">Hetzner Object Storage</text><text x="622" y="707" fill="#aab7d3" font-size="17">S3-compatible asset path</text><text x="622" y="739" fill="#aab7d3" font-size="17">legacy static bridge during cutover</text>
    <rect x="1084" y="582" width="420" height="190" rx="18" fill="#0c1b36" stroke="#405d9d"/><text x="1116" y="628" fill="#9db0ff" font-size="17" font-weight="700">PROVIDER BOUNDARY</text><text x="1116" y="671" fill="#fff" font-size="25" font-weight="700">Optional cloud AI</text><text x="1116" y="707" fill="#aab7d3" font-size="17">Vertex remains explicit and gated</text><text x="1116" y="739" fill="#aab7d3" font-size="17">migration ≠ indiscriminate purge</text>
  </g>
</svg>
