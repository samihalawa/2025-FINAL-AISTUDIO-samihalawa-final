server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;
  port_in_redirect off;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
  error_page 404 /404.html;

  if ($host = www.samihalawa.com) { return 301 https://samihalawa.com$request_uri; }
  location = /index.html { return 301 https://samihalawa.com/; }

  # Retired consulting and training routes now reinforce the engineering portfolio.
  location = /services { return 301 https://samihalawa.com/projects; }
  location ^~ /services/ { return 301 https://samihalawa.com/projects; }
  location = /locations { return 301 https://samihalawa.com/projects; }
  location ^~ /locations/ { return 301 https://samihalawa.com/projects; }
  location = /corporate { return 301 https://samihalawa.com/projects; }
  location = /ai-training { return 301 https://samihalawa.com/projects; }
  location = /blog { return 301 https://samihalawa.com/projects; }
  location ^~ /blog/ { return 301 https://samihalawa.com/projects; }

  location = /robots.txt {
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }
  location = /sitemap.xml {
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }
  location ^~ /demos/ {
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files $uri $uri/index.html =404;
  }
  location ~ ^(.+)/+$ { return 301 https://samihalawa.com$1$is_args$args; }
  location ~* \.(?:md|json|txt)$ {
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files $uri =404;
  }
  location ~* \.(?:js|css)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  location ~* \.(?:png|jpe?g|svg|webp|woff2|pdf)$ {
    add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
    try_files $uri =404;
  }
  location ~* /[^/]+\.[^/]+$ {
    try_files $uri =404;
  }
  location = / {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files /index.html =404;
  }
  location / {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri/index.html =404;
  }
  location = /404.html { internal; }
}
